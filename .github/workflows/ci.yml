name: Portfolio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1-Multi-Tenant-Simple
    env:
      JWT_SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests -v --cov=app --cov-report=term-missing
      - run: uv run ruff check app tests

  project-2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2-Multi-Tenant-MCP-Tool-Gateway
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests -v --cov=app --cov-report=term-missing
      - run: uv run ruff check app tests scripts
      - run: uv run mypy app
      - run: uv run python scripts/run_evals.py --output /tmp/gateway-evals.json

  project-3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3-Multi-Tenant-Evals
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -v --cov=eval_harness --cov-report=term-missing
      - run: uv run ruff check eval_harness tests
      - run: uv run python tests/run_regression.py --output /tmp/per-tenant-evals.json

  project-4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4-Tenant-Configurable-Orchestration
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -v --cov=orchestration --cov-report=term-missing
      - run: uv run ruff check orchestration tests
      - run: uv run mypy orchestration
