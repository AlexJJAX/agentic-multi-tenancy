[project]
name = "multi-tenant-rag-chatbot"
version = "0.1.0"
description = "Multi-tenant RAG chatbot demo with FastAPI, LangChain, ChromaDB, and SQLite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.9",
    "fastapi>=0.139.0",
    "greenlet>=3.5.3",
    "jinja2>=3.1.6",
    "langchain>=1.3.12",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.0",
    "langchain-openai>=1.3.4",
    "langchain-text-splitters>=0.4.0",
    "langgraph>=1.2.9",
    "langsmith>=0.10.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.51.0",
    "pyjwt>=2.13.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7,<8",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
]
