[project]
name = "local-multi-tenant-mcp-tool-gateway"
version = "0.1.0"
description = "One-process local multi-tenant RAG chatbot with an authenticated MCP tool gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22,<1",
    "chromadb>=1.5,<2",
    "cryptography>=46,<48",
    "fakeredis>=2.34,<3",
    "fastapi>=0.139,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "langchain>=1.3,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "langchain-openai>=1.3,<2",
    "langchain-text-splitters>=1.1,<2",
    "mcp>=1.27,<2",
    "pydantic-settings>=2.14,<3",
    "pyyaml>=6.0,<7",
    "pyjwt[crypto]>=2.13,<3",
    "python-multipart>=0.0.22,<1",
    "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
multi-tenant-demo = "app.cli:main"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101", # Assertions are expected in tests.
    "S105", # Demo credential identifiers are intentionally documented.
    "S106", # Demo passwords appear only in seed fixtures and documentation.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["tests"]
