[project]
name = "multi-tenant-evals"
version = "0.1.0"
description = "Deterministic per-tenant RAG quality and isolation evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.3,<2.0",
    "pydantic-settings>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
]

[project.scripts]
tenant-evals = "eval_harness.cli:main"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_harness"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
